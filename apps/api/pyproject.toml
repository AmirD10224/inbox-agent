[project]
name = "inbox-agent"
version = "0.1.0"
description = "AI customer support agent with classify/draft/escalate, full observability and evals."
readme = "../../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amir Dhibi", email = "amir10.dhibi@gmail.com" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # LLM
    "anthropic>=0.39.0",
    "voyageai>=0.3.2",

    # Data / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2.3",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",

    # Observability
    "langfuse>=2.55.0",
    "structlog>=24.4.0",

    # FAQ ingest
    "httpx>=0.28.0",
    "trafilatura>=2.0.0",

    # Cost estimation (pre-call). Actual billing uses anthropic usage tokens.
    "tiktoken>=0.8.0",

    # Prompt frontmatter
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-requests",
    "httpx>=0.28.0",
    # alembic offline migration generation
    "psycopg2-binary>=2.9.10",
    # in-memory test DB
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_agent"]

# ───────────────────────── ruff ─────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "N",                # pep8-naming
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async best practices
    "S",                # bandit (security)
]
ignore = [
    "S101",  # asserts allowed in tests
    "B008",  # FastAPI uses Depends() in defaults
    "S603",  # subprocess.run with explicit args is safe
    "S607",  # docker/git on PATH is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S105", "S106", "S311"]
"alembic/**/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ───────────────────────── mypy ─────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]
# `src` for the inbox_agent package, `../../` for the repo-root `evals/`
# package that the smoke-stratifier test imports.
mypy_path = "src:../.."

[[tool.mypy.overrides]]
module = [
    "langfuse",
    "langfuse.*",
    "voyageai",
    "voyageai.*",
    "trafilatura",
    "trafilatura.*",
    "tiktoken",
    "tiktoken.*",
    "pgvector",
    "pgvector.*",
    "yaml",
]
ignore_missing_imports = true
follow_imports = "skip"

# ───────────────────────── pytest ─────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=inbox_agent.agent",
    "--cov=inbox_agent.llm",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=75",
]
markers = [
    "integration: integration tests using respx-recorded LLM responses",
    "e2e: end-to-end tests requiring docker-compose stack",
]

# ───────────────────────── coverage ─────────────────────────
[tool.coverage.run]
branch = true
source = ["inbox_agent"]
omit = [
    "src/inbox_agent/__init__.py",
    "src/inbox_agent/main.py",
    "src/inbox_agent/db/__init__.py",
    "*/tests/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
