name: Evals

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Run scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 0.5.4
          enable-cache: true

      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]"

      - name: Decide eval mode
        id: mode
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'eval') }}" == "true" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch baseline scorecard from main
        id: baseline
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p evals/results
          if git show origin/main:evals/results/scorecard.json > evals/results/baseline.json 2>/dev/null; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set, skipping evals."
            exit 0
          fi
          python -m evals.run_evals \
            --golden evals/golden_set.jsonl \
            --out evals/results/scorecard.json \
            --markdown-out evals/results/comment.md \
            ${{ steps.baseline.outputs.has_baseline == 'true' && '--baseline evals/results/baseline.json --fail-on-regression' || '' }} \
            --${{ steps.mode.outputs.mode }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-${{ github.run_id }}
          path: evals/results/

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/results/comment.md';
            if (!fs.existsSync(path)) {
              console.log('No comment.md produced, skipping.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### InboxAgent eval scorecard';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
